services:
  app:
    build: .
    container_name: carro-unidosis-app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:password@db:5432/pharmacy_cart?schema=public
      - NODE_ENV=production
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    container_name: carro-unidosis-db
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=pharmacy_cart
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  db_data:
